services:
  - type: web
    name: spark-api
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: npx prisma migrate deploy && node dist/index.js
    healthCheckPath: /health
  - type: worker
    name: spark-worker
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run build
    startCommand: node dist/worker.js
  - type: static
    name: spark-web
    runtime: static
    plan: free
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: client/dist

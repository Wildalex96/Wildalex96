<!doctype html><html lang="ru"><head><meta charset="UTF-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self';style-src 'self' 'unsafe-inline';script-src 'self'"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LocalMind Agent</title><link rel="stylesheet" href="styles.css"></head><body><aside><div class="brand">LocalMind <span>Agent</span></div><button id="newChat">＋ Новый чат</button><button id="agentBtn">🤖 Агент</button><div class="sideTitle">Память</div><div id="memoryList" class="memory"></div><button id="clearMemory" class="danger">Очистить память</button><div class="sideBottom"><button id="settingsBtn">⚙ Настройки и разрешения</button><div class="status" id="status">● Запуск ИИ…</div></div></aside><main><header><div><h1>LocalMind Agent</h1><p>Многошаговые задачи · интернет · память · расписание</p></div><div class="model" id="modelName"></div></header><section id="chat" class="chat"><div class="welcome"><div class="orb">✦</div><h2>Поставьте задачу</h2><p>Например: «Исследуй тему, сравни источники и создай отчёт».</p></div></section><form id="form" class="composer"><textarea id="input" rows="1" placeholder="Напишите сообщение или задачу агенту…"></textarea><button id="send" type="submit">➤</button></form></main><dialog id="agent"><h2>🤖 Автономный агент</h2><textarea id="goal" rows="4" placeholder="Цель агента…"></textarea><div class="actions"><button id="runAgent">Запустить сейчас</button><button id="closeAgent">Закрыть</button></div><h3>Запланировать</h3><input id="when" type="datetime-local"><select id="repeat"><option value="">Один раз</option><option value="hourly">Каждый час</option><option value="daily">Каждый день</option><option value="weekly">Каждую неделю</option></select><button id="scheduleAgent">Запланировать</button><h3>Разрешения</h3><label><input id="pweb" type="checkbox" checked> Интернет</label><label><input id="pread" type="checkbox" checked> Читать файлы</label><label><input id="pwrite" type="checkbox"> Записывать файлы</label><label><input id="pcode" type="checkbox"> Запуск кода</label><label><input id="pdocs" type="checkbox" checked> Создавать документы</label><pre id="agentLog"></pre></dialog><dialog id="settings"><form method="dialog" id="settingsForm"><h2>Настройки</h2><label><input type="checkbox" id="internet" checked> Интернет-поиск</label><label><input type="checkbox" id="autoLearn" checked> Автоматическая память</label><div class="actions"><button value="cancel">Отмена</button><button id="saveSettings" value="default">Сохранить</button></div></form></dialog><script src="renderer.js"></script></body></html>
